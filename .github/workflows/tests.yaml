---
name: 🔬 Tests
"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - extra_platforms/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/tests.yaml
  pull_request:
    branches-ignore:
      # This filter matches the PR's *base* branch (always `main`), not its
      # head, so it does not actually exclude these PRs: see
      # https://github.com/actions/runner/issues/1591. Kept here as
      # documentation of intent, since the skip only becomes real through a
      # `github.head_ref` check on a job's `if:`, propagated through `needs:`.
      # Named no more precisely than that because `repomatic init
      # workflows/tests.yaml` copies this header into downstream repos, which
      # own their jobs and carry no `metadata` job for it to point at.
      - major-version-increment
      - minor-version-increment
      - prepare-release
    paths:
      - extra_platforms/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/tests.yaml
  schedule:
    # Run tests monthly to catch regressions from dependency or environment changes.
    - cron: "17 9 1 * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, '[changelog] Release') }}

# Supply-chain cooldown: no package published within the window can be resolved by
# any command in this workflow. Set here, not per command, so it also covers the
# `metadata` bootstrap and any step added later; a workflow-level `env:` cannot
# reference `needs`, so the window is a literal kept equal to `[tool.repomatic]
# minimum-release-age`. repomatic's own test suite enforces that upstream; a
# synced copy is kept in step by hand. Deliberate bypasses are per-package CLI
# flags (`--exclude-newer-package`, `--min-release-age-exclude`).
# See claude.md for the rationale.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  metadata:
    name: 🧬 Project metadata
    # Skipping this job propagates to every `needs: metadata` job below.
    # The `pull_request.branches-ignore` filter above matches the PR's base
    # branch (always `main`), not its head branch (see
    # https://github.com/actions/runner/issues/1591), so the version-bump
    # PRs slip through it and must be filtered here via `github.head_ref`.
    # The branch list mirrors repomatic's `VERSION_BUMP_BRANCHES`.
    #
    # The `[changelog] Post-release bump ` commit prefix is intentionally
    # *not* in this list: that push also carries the release commit, and
    # the post-release-bump head commit is our only post-merge test of the
    # release-frozen tree. The commit-prefix list mirrors repomatic's
    # `MANUAL_VERSION_BUMP_COMMIT_PREFIXES`.
    if: >
      !contains(fromJSON('["major-version-increment","minor-version-increment","prepare-release"]'),
      github.head_ref)
      && !startsWith(github.event.head_commit.message || '', '[changelog] Bump major version to ')
      && !startsWith(github.event.head_commit.message || '', '[changelog] Bump minor version to ')
    runs-on: ubuntu-26.04
    outputs:
      metadata: ${{ steps.metadata.outputs.metadata }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.2"
      - name: Run repomatic metadata
        id: metadata
        # `--exclude-newer-package repomatic=P0D` exempts this one package from the
        # workflow-wide cooldown above: the self-pin always names a release minutes
        # old, so the window it enforces on everything else would make it
        # unresolvable. Spelled exactly as repomatic's release freeze writes it
        # (repomatic.prepare_release.SELF_PIN_COOLDOWN_EXEMPTION), so
        # `sync-workflow-pins` recognizes and moves it with the pin.
        run: >
          uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.11.0' metadata
          --format github-json --output "$GITHUB_OUTPUT"
          test_matrix test_matrix_pr

  tests:
    needs:
      - metadata
    strategy:
      fail-fast: false
      # Matrix is pre-computed by repomatic metadata. PRs get a reduced matrix
      # (fewer OS variants and Python versions) to save CI minutes.
      matrix: >-
        ${{ github.event_name != 'pull_request'
        && fromJSON(needs.metadata.outputs.metadata).test_matrix
        || fromJSON(needs.metadata.outputs.metadata).test_matrix_pr }}
    name: "${{ matrix.state == 'stable' && '✅' || '⁉️' }} ${{ matrix.os }} / py${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    # We keep going when a job flagged as not stable fails.
    continue-on-error: ${{ matrix.state == 'unstable' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.2"
      - name: Force native ARM64 Python on Windows ARM64
        # Workaround for https://github.com/astral-sh/uv/issues/12906: uv defaults to x86_64 Python on ARM64 Windows,
        # relying on transparent emulation, so the ARM64 Windows cells would silently test emulated x86_64 Python
        # instead of native ARM64. Setting UV_PYTHON to an architecture-qualified specifier forces uv (and uvx) to
        # use native ARM64 Python for all steps. This matters more here than in most repos: the suite asserts on
        # detected architecture, so an emulated interpreter tests the wrong thing rather than merely the wrong build.
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: echo "UV_PYTHON=cpython-${PYTHON_VERSION}-aarch64" >> "$GITHUB_ENV"
      - name: Install Python ${{ matrix.python-version }}
        # If UV cannot find the requested Python version, it exits with code 2, which let the job pass unnoticed on
        # Windows. So we force the shell to bash, even on Windows, and "set -e" to ensure any error in the install
        # process is caught and fails the job. It works because Windows runners too Git Bash available).
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set -e
          uv --no-progress venv --python "${UV_PYTHON:-${PYTHON_VERSION}}"
      - name: Force UTF-8 encoding on Windows
        # Workaround for https://github.com/pallets/click/issues/2121: Windows GitHub Actions runners
        # redirect command output to files, which sets the encoding to the system default (cp1252).
        # Python CLI frameworks like Click then raise UnicodeEncodeError on non-ASCII output.
        if: runner.os == 'Windows'
        shell: bash
        run: echo "PYTHONIOENCODING=utf8" >> "$GITHUB_ENV"
      - name: Install project
        # Install all extras, so we can check any incompatibility.
        run: uv --no-progress sync --frozen --all-extras --group test --group docs

      - name: CLI test suite via console script
        run: >
          uvx --no-progress 'click-extra==8.8.1' test-suite
          --command "uv run --frozen -- extra-platforms"
          --suite-file tests/cli-test-suite.toml
          --jobs max
      - name: CLI test suite via python -m
        run: >
          uvx --no-progress 'click-extra==8.8.1' test-suite
          --command "uv run --frozen -- python -m extra_platforms"
          --suite-file tests/cli-test-suite.toml
          --jobs max

      - name: Unittests
        env:
          # Used by github_runner_os() in tests/test_detection.py to extract the GitHub runner image ID.
          EXTRA_PLATFORMS_TEST_MATRIX: ${{ toJson(matrix) }}
        # Coverage and parallelism flags live here rather than in
        # [tool.pytest] addopts so a from-source packager build can run a plain
        # `pytest` without pytest-cov or pytest-xdist. --dist=loadgroup honors
        # the xdist_group markers (the sphinx tests must share one worker).
        #
        # The coverage floor is `[tool.coverage] report.fail_under`, which every
        # cell must clear on its own. No --cov-fail-under flag is passed here: it
        # would outrank the config and shadow the knob. The floor is set well
        # below any single cell because coverage swings with the runner, most of
        # the suite skipping whatever does not match the host platform.
        run: >
          uv --no-progress run --frozen -- pytest
          --cov --cov-report=term
          --numprocesses=auto --dist=loadgroup

  test-package-install:
    name: 📦 Package install
    needs:
      - metadata
    # Installs from PyPI/GitHub (released version), not the PR code.
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        os:
          - ubuntu-26.04-arm # arm64
          - ubuntu-26.04     # x86
          - ubuntu-24.04-arm # arm64
          - ubuntu-24.04     # x86
          - ubuntu-22.04-arm # arm64
          - ubuntu-22.04     # x86
          - macos-26         # arm64
          - macos-15         # arm64
          - macos-15-intel   # x86
          - macos-14         # arm64
          - windows-11-arm   # arm64
          - windows-2025     # x86
          - windows-2022     # x86
    runs-on: ${{ matrix.os }}
    env:
      # The one job opting out of the workflow-wide supply-chain cooldown, by
      # setting a zero-length window. Its subject IS the freshly published
      # release: it answers "does the version that shipped minutes ago install
      # and run?", which a cooldown makes unanswerable. Safe to scope here: the
      # job inherits `permissions: {}`, takes no secrets, and only runs the CLI
      # on a throwaway runner.
      UV_EXCLUDE_NEWER: P0D
    steps:
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          # windows-2025 runners have only Python 3.9 installed.
          python-version: ${{ matrix.os == 'windows-2025' && '3.10' || ''}}
          version: "0.12.2"
      - name: Run stable CLI
        run: |
          uvx    extra-platforms
          uvx    --from extra-platforms                                              -- extra-platforms
          uv run --with extra-platforms                                              -- extra-platforms
          uv run --with extra-platforms                                              -m extra_platforms
          uv run --with extra-platforms                                        python -m extra_platforms
      - name: Run dev CLI
        run: |
          uvx    --from git+https://github.com/kdeldycke/extra-platforms -- extra-platforms
          uv run --with git+https://github.com/kdeldycke/extra-platforms -- extra-platforms
          uv run --with git+https://github.com/kdeldycke/extra-platforms -m extra_platforms
          uv run --with git+https://github.com/kdeldycke/extra-platforms python -m extra_platforms
      - name: Run stable CLI via uv tool
        run: |
          uv --no-progress tool install extra-platforms
          extra-platforms
          uv --no-progress tool uninstall extra-platforms
      - name: Run dev CLI via uv tool
        run: |
          uv --no-progress tool install git+https://github.com/kdeldycke/extra-platforms
          extra-platforms
          uv --no-progress tool uninstall extra-platforms
      - name: Run CLI via pipx
        run: |
          uv --no-progress tool install pipx
          pipx run                                                                      extra-platforms
          pipx run --spec extra-platforms                                                extra-platforms
          pipx run --spec git+https://github.com/kdeldycke/extra-platforms              extra-platforms
          uv --no-progress tool uninstall pipx
      - name: Run CLI via pip
        run: |
          pip install extra-platforms
          extra-platforms
